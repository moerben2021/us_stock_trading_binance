# System Configuration
# US Stock DCA Framework - Production Configuration

system:
  timezone: "America/New_York"
  log_level: "INFO"

scheduler:
  check_interval: 60
  manual_trade_scan_interval: 300

database:
  path: "./data/trading.db"

cache:
  realtime_price_ttl: 30
  history_data_clear_time: "02:00"

retry:
  api_call:
    max_attempts: 3
    interval_seconds: 5
    backoff: 1.5
  data_fetch:
    max_attempts: 3
    interval_seconds: 10
    backoff: 1.5
  trade_execution:
    max_attempts: 2
    interval_seconds: 3
    backoff: 1.2

notifications:
  admin_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_SYSTEM_WEBHOOK_KEY"  # 系统级通知 webhook（日报/周报/月报）
  summaries:
    daily:
      enabled: true
      time: "16:30"  # 美东时间下午 4:30（收盘后）
    weekly:
      enabled: true
      day: "Friday"
      time: "16:30"
    monthly:
      enabled: true
      day: 28
      time: "16:30"

snapshots:
  after_trade: true
  daily_close: true

balance_check:
  insufficient_action: "warn"  # 可选: warn, skip, partial
